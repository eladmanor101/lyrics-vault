[package]
name = "lyrics-vault"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.14.0", features = ["tokio"] }
iced_anim = "=0.3.1"

kakasi = "0.1.0"

tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
regex = "=1.12.3"

tracing = "0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.4"

futures = "=0.3.32"
thiserror = "=2.0.18"
async-trait = "0.1.89"

[dependencies.windows]
version = ">=0.59, <=0.62"
features = [
    "Media",
    "Media_Control",
    "Data_Xml_Dom",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]